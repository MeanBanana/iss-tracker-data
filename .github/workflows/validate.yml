name: Validate events

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validator tests
        run: python -m unittest discover tests
      - name: Validate sstv-events.json
        run: python scripts/validate.py sstv-events.json
      - name: Validate radios.json
        run: |
          if [ -f radios.json ]; then
            python -c "import json,sys; sys.path.insert(0,'scripts'); import build_radios as b; p=b.validate(json.load(open('radios.json'))); print(*p, sep='\n'); sys.exit(bool(p))"
          fi
