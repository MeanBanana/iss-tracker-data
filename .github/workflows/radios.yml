name: Build radios.json

# Weekly: extracts radios that can receive 2 m / 70 cm from CHIRP and Hamlib,
# builds radios.json and commits it to main when it changed. Pull requests that
# touch the builder run build-only (nothing is committed) and upload artifacts.

on:
  schedule:
    - cron: "23 4 * * 1" # weekly build
    - cron: "41 5 2 * *" # monthly keepalive (GitHub disables idle crons after 60 days)
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/build_radios.py
      - sdr-extra.json
      - requirements-radios.txt
      - .github/workflows/radios.yml

permissions:
  contents: write

concurrency:
  group: build-radios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.schedule != '41 5 2 * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hamlib and CHIRP
        run: |
          sudo apt-get update
          sudo apt-get install -y libhamlib-utils
          pip install -r requirements-radios.txt

      - name: Unit tests
        run: python -m unittest tests.test_build_radios

      - name: Build radios.json
        run: python scripts/build_radios.py --out radios.json --min-radios 517

      - name: Validate radios.json
        run: python -c "import json,sys; sys.path.insert(0,'scripts'); import build_radios as b; p=b.validate(json.load(open('radios.json'))); print(*p, sep='\n'); sys.exit(bool(p))"

      - name: Save raw rigctl output
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/raw"
          rigctl -l > "$RUNNER_TEMP/raw/rigctl_list.txt" || true
          id=$(awk '$1 ~ /^[0-9]+$/ && /IC-9700/ {print $1; exit}' "$RUNNER_TEMP/raw/rigctl_list.txt")
          echo "IC-9700 rig id: $id"
          rigctl -m "$id" --dump-caps > "$RUNNER_TEMP/raw/rigctl_caps_ic9700.txt" || true

      - name: Upload radios.json
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: radios.json
          path: radios.json

      - name: Upload raw rigctl output
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rigctl-raw
          path: ${{ runner.temp }}/raw/

      - name: Commit radios.json to main
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radios.json
          if git diff --cached --quiet; then
            echo "radios.json unchanged"
          else
            git commit -m "Update radios.json from CHIRP and Hamlib"
            git push
          fi

  keepalive:
    if: github.event.schedule == '41 5 2 * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Keepalive"
          git push
