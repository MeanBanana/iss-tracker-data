name: Update events

# Reads the ARISS upcoming-SSTV page and press RSS every 2 hours and proposes
# changes to sstv-events.json as ONE pull request (branch auto/sstv-events)
# for a human to merge. Never pushes events to main and never merges.

on:
  schedule:
    - cron: "17 */2 * * *" # update
    - cron: "41 5 1 * *" # monthly keepalive (GitHub disables idle crons after 60 days)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: update-events
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  BRANCH: auto/sstv-events
  BROKEN_TITLE: Parser needs attention

jobs:
  update:
    if: github.event.schedule != '41 5 1 * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PRs opened with GITHUB_TOKEN don't trigger validate.yml, so check here.
      - name: Unit tests
        run: python -m unittest discover tests

      - name: Parse ARISS
        id: parse
        run: |
          python scripts/update_events.py --file sstv-events.json --report "$RUNNER_TEMP/report.json"
          echo "status=$(jq -r .status "$RUNNER_TEMP/report.json")" >> "$GITHUB_OUTPUT"

      - name: Report a broken parser
        if: steps.parse.outputs.status == 'broken'
        run: |
          {
            echo "The scheduled ARISS parse could not produce a valid sstv-events.json, so no pull request was opened."
            echo
            jq -r '.problems[] | "- " + .' "$RUNNER_TEMP/report.json"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "See \"Fixing 'Parser needs attention'\" in the README."
          } > "$RUNNER_TEMP/issue.md"
          number=$(gh issue list --state open --search "in:title \"$BROKEN_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$BROKEN_TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$BROKEN_TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Close the broken-parser issue once it works again
        if: steps.parse.outputs.status != 'broken'
        run: |
          number=$(gh issue list --state open --search "in:title \"$BROKEN_TITLE\"" --json number,title             --jq "map(select(.title == \"$BROKEN_TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Parser works again ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          fi

      - name: Report frequencies the app doesn't know
        if: steps.parse.outputs.status != 'broken'
        run: |
          jq -r '.mismatches[]' "$RUNNER_TEMP/report.json" | while IFS= read -r title; do
            known=$(gh issue list --state all --search "in:title \"$title\"" --json title \
              --jq "map(select(.title == \"$title\")) | length")
            if [ "$known" = "0" ]; then
              gh issue create --title "$title" --body "An ARISS SSTV event uses a frequency that isn't one of the app's built-in downlinks (app-frequencies.json). Phones already use the event's frequency from sstv-events.json; this is a reminder to update the app's fallback."
            fi
          done

      - name: Propose the change
        if: steps.parse.outputs.status == 'changed'
        run: |
          python scripts/validate.py sstv-events.json | tee "$RUNNER_TEMP/validate.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add sstv-events.json
          git commit -m "Update SSTV events from ARISS"
          git push --force origin "$BRANCH"
          {
            echo "Automatic update from the [ARISS upcoming SSTV events page](https://www.ariss.org/upcoming-sstv-events.html) and press releases."
            echo
            echo "**Check the dates, times and frequency against ARISS before merging**: the page is free text, and a misread value reaches every phone. Wrong field? Fix it in \`overrides.json\` on main, and the next run uses it."
            echo
            if [ "$(jq '.missing | length' "$RUNNER_TEMP/report.json")" != "0" ]; then
              echo "### Missing from ARISS — check by hand"
              echo
              echo "These events haven't ended but ARISS no longer lists them. They are kept unchanged, so phones don't lose them silently. If one was cancelled, set \`\"status\": \"cancelled\"\`; if it is wrong, delete it by hand."
              echo
              jq -r '.missing[] | "- " + .' "$RUNNER_TEMP/report.json"
              echo
            fi
            echo '```diff'
            git diff origin/main -- sstv-events.json
            echo '```'
            echo
            echo "Validator: \`$(cat "$RUNNER_TEMP/validate.txt")\` (unit tests passed in this run)."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/pr.md"
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$RUNNER_TEMP/pr.md"
          else
            gh pr create --base main --head "$BRANCH" --title "Update SSTV events from ARISS" --body-file "$RUNNER_TEMP/pr.md"
          fi

      - name: Close a proposal that is no longer needed
        if: steps.parse.outputs.status == 'unchanged'
        run: |
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr close "$number" --delete-branch --comment "ARISS now matches sstv-events.json on main; nothing to change."
          fi

  keepalive:
    if: github.event.schedule == '41 5 1 * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Keepalive"
          git push
